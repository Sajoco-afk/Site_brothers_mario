<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Site do mario!</title>
</head>

<body>

    <div class="background">
        <img class="maldito-mario" src="./logo-header.png" alt="Imagem de fundo do site do Mario">
        <a>Home</a>
        <a>Sobre</a>
        <a>Contato</a>
        <a>Nossos serviços</a>
    </div>

    <div class="header">
        <div>
            <img class="logo-logo" src="./logo.png" alt="Logo-do-site-Mario">

            <p>Este é o site do Mario, aqui você vai encontrar informações sobre o jogo, personagens e muito mais!</p>

            <button>Entre em contato!</button>
        </div>
        <div>
            <img class="mario-luigi" src="./mario.png" alt="Mario e Luigi">
        </div>
    </div>
    <div class="video">
        <video class="video" src="./video.mp4" controls autoplay muted loop></video>
    </div>

    <div class="whats">
        <a>
            <img src="./whatsapp.png" alt="Logo do WhatsApp">
        </a>
    </div>

    <form class="formulario">
        <h2>Faça seu orçamento!</h2>
        <input type="text" placeholder="Digite seu nome">
        <input type="email" placeholder="Digite seu e-mail">
        <textarea placeholder="Digite sua mensagem!"></textarea>
        <button type="submit">Pedir Orçamento!</button>
    </form>

    <div class="mascara"></div>
    <div class="mascara-formulario"></div>

    <script src="scripts.js"></script>
</body>

</html>
